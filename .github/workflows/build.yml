name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hydcraft_console?schema=public
      NUXT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hydcraft_console?schema=public
      NUXT_SESSION_SECRET: ci-demo-session-secret
      NUXT_HYDROLINE_ISSUER: https://hydcraft.example
      NUXT_OIDC_CLIENT_ID: ci-demo-client
      NUXT_OIDC_CLIENT_SECRET: ci-demo-client-secret
      NUXT_OIDC_REDIRECT_URI: https://hydcraft.example/api/oidc/hydcraft/callback
      NUXT_SOURCE_SECRET_ENCRYPTION_KEY: ci-demo-source-encryption-key
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build
        run: pnpm build

  sync:
    name: Sync CNB
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cnb-main-sync
      cancel-in-progress: false
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || {
            echo 'CNB_REPOSITORY_SLUG GitHub Actions variable is required.' >&2
            exit 1
          }
          test -n "$CNB_TOKEN" || {
            echo 'CNB_TOKEN GitHub Actions secret is required.' >&2
            exit 1
          }

      - name: Sync
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e "PLUGIN_TARGET_URL=https://cnb.cool/$CNB_REPOSITORY_SLUG.git" \
            -e 'PLUGIN_AUTH_TYPE=https' \
            -e 'PLUGIN_USERNAME=cnb' \
            -e "PLUGIN_PASSWORD=$CNB_TOKEN" \
            -e 'PLUGIN_BRANCH=main' \
            -e 'PLUGIN_GIT_USER=cnb' \
            -e 'PLUGIN_GIT_EMAIL=cnb@cnb.cool' \
            -e 'PLUGIN_FORCE=true' \
            tencentcom/git-sync
